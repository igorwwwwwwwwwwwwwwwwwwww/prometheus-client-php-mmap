[package]
name = "prometheus-client-php-mmap"
version = "0.1.0"
edition = "2024"

[lib]
name = "prometheus_client_php_mmap"
crate-type = ["rlib", "cdylib"]

[dependencies]
ext-php-rs = "0.15.6"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "mmap_bench"
harness = false
